<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1673e6"><title>Мобильный перекуп</title>
<style>
:root{--blue:#1673e6;--blue2:#eaf3ff;--ink:#182230;--muted:#758195;--line:#e8edf3;--bg:#f4f6f9;--green:#168653;--red:#d94848}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 28px #15263a12;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;background:#fff;padding:13px 16px 11px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}.logo{width:31px;height:31px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:900}.topline{display:flex;justify-content:space-between;align-items:center}.balance{font-size:12px;color:var(--green);font-weight:700;background:#eaf8f0;padding:7px 10px;border-radius:20px}.location{font-size:12px;color:var(--muted);margin-top:7px}.content{padding:14px 14px 20px}.section-title{font-size:20px;font-weight:800;margin:4px 0 12px}.sub{font-size:13px;color:var(--muted)}.searchbar{display:flex;gap:8px;margin:10px 0 14px}.searchbar input,.field,input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}.searchbar input:focus,.field:focus,input:focus{border-color:#8dbaff}.pillrow{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.pill{white-space:nowrap;background:#f2f5f9;border-radius:22px;padding:8px 13px;font-size:12px;color:#4d5b6e}.pill.active{background:var(--blue2);color:var(--blue);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;min-width:0}.photo{height:138px;background:linear-gradient(135deg,#eef2f7,#dfe7f1);display:grid;place-items:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.phone-art{font-size:62px;filter:drop-shadow(0 8px 5px #0002)}.heart{position:absolute;right:9px;top:9px;background:#ffffffed;border-radius:50%;width:31px;height:31px;font-size:17px;color:#8a95a5}.heart.on{color:#e34e68}.cardbody{padding:10px}.price{font-size:18px;font-weight:850;margin-bottom:4px}.name{font-weight:650;font-size:14px;line-height:1.3;min-height:36px}.meta{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}.sellerline{font-size:11px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:5px}.avatar{width:24px;height:24px;border-radius:50%;background:#e6efff;color:var(--blue);display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}.tag{display:inline-block;background:#fff3df;color:#98600b;padding:4px 7px;border-radius:6px;font-size:10px;margin-top:6px}.btn{padding:11px 13px;border-radius:11px;background:var(--blue);color:white;font-weight:700;font-size:13px}.btn.secondary{background:#eef4fc;color:var(--blue)}.btn.light{background:#f1f3f6;color:#3e4b5c}.btn.danger{background:#fff0f0;color:var(--red)}.btn.full{width:100%}.btn.small{padding:8px 10px;font-size:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);height:70px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:8;padding-bottom:env(safe-area-inset-bottom)}.nav{background:none;color:#8994a4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.nav .ico{font-size:21px;line-height:1}.nav.active{color:var(--blue);font-weight:800}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.panel{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:12px}.seller{display:flex;align-items:center;gap:10px}.seller .avatar{width:43px;height:43px;font-size:15px}.stars{color:#f3a51b;font-weight:800}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.empty{text-align:center;padding:42px 18px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:10px}.chatitem{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.chatitem .avatar{width:42px;height:42px;font-size:14px}.chatbubble{background:#eef4fc;padding:10px 12px;border-radius:14px;margin:8px 0;max-width:85%;font-size:13px}.chatbubble.mine{background:#1673e6;color:white;margin-left:auto}.chatlog{min-height:180px;max-height:45vh;overflow:auto;background:#fafbfd;border-radius:13px;padding:10px}.modalback{position:fixed;inset:0;background:#10203366;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:#fff;width:min(540px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px}.close{float:right;background:#f1f3f6;border-radius:50%;width:32px;height:32px}.formrow{margin:10px 0}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.detailphoto{height:205px;border-radius:15px;background:#eef2f7;display:grid;place-items:center;font-size:88px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f5f7fa;border-radius:12px;padding:11px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.notice{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#202b3a;color:#fff;border-radius:22px;padding:10px 16px;font-size:12px;z-index:30;box-shadow:0 4px 20px #0002;max-width:90%;text-align:center}.hide{display:none!important}.filterrow{display:flex;gap:7px}.filterrow>*{min-width:0}.section-head{display:flex;align-items:center;justify-content:space-between;margin:5px 0 12px}.listcard{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.listpic{width:100px;height:92px;border-radius:12px;background:#eef2f7;display:grid;place-items:center;font-size:42px;flex-shrink:0}.badge{font-size:10px;border-radius:6px;padding:4px 7px;background:#eaf8f0;color:#168653}
</style></head><body><div class="app"><header class="top"><div class="topline"><div class="brand"><div class="logo">МП</div>Мобильный перекуп</div><div class="balance" id="balance">30 000 ₽</div></div><div class="location">⌖ Санкт-Петербург · Игровой рынок</div></header><main class="content" id="view"></main><nav class="bottom"><button class="nav active" data-tab="home"><span class="ico">⌂</span>Главная</button><button class="nav" data-tab="search"><span class="ico">⌕</span>Поиск</button><button class="nav" data-tab="fav"><span class="ico">♡</span>Избранное</button><button class="nav" data-tab="chats"><span class="ico">▤</span>Чаты</button><button class="nav" data-tab="profile"><span class="ico">◉</span>Профиль</button></nav></div><div id="modal"></div><div id="toast" class="notice hide"></div>
<script>
const initial=[
['iPhone 13','128 ГБ · Midnight','23 500',23500,'Хорошее','91%','📱','Артём','4.9',12,'Проверен, Face ID работает'],['iPhone 11','64 ГБ · Black','12 000',12000,'Есть дефект','84%','📱','Максим','4.7',8,'Трещина на стекле камеры'],['Samsung Galaxy S22','128 ГБ · Green','19 900',19900,'Отличное','88%','📱','Диана','5.0',24,'Полный комплект'],['Xiaomi Redmi Note 12','128 ГБ · Blue','8 500',8500,'Хорошее','96%','📱','Илья','4.8',15,'Небольшие следы использования'],['iPhone 12 Pro','256 ГБ · Graphite','27 000',27000,'Хорошее','87%','📱','Роман','4.9',31,'Есть коробка, всё работает'],['Samsung A54','128 ГБ · Black','9 000',9000,'На ремонт','79%','📱','Олег','4.6',6,'Быстро разряжается'],['iPhone XR','64 ГБ · White','7 900',7900,'Есть дефект','82%','📱','Полина','4.8',19,'Не работает динамик'],['Google Pixel 7','128 ГБ · Obsidian','21 000',21000,'Отличное','93%','📱','Егор','5.0',11,'Камера в идеале'],['iPhone 14','128 ГБ · Purple','34 000',34000,'Хорошее','90%','📱','Кирилл','4.9',17,'Без ремонта'],['OnePlus 10 Pro','256 ГБ · Black','18 500',18500,'Хорошее','89%','📱','Марк','4.7',9,'Комплект полный'],['iPhone SE 2022','64 ГБ · Red','11 500',11500,'Отличное','95%','📱','Алина','5.0',14,'Очень аккуратный'],['Xiaomi 13 Lite','128 ГБ · Pink','14 000',14000,'Хорошее','92%','📱','Денис','4.8',7,'Без сколов'],['Samsung S21 FE','128 ГБ · Olive','15 500',15500,'Есть дефект','86%','📱','Никита','4.5',5,'Разбит задний корпус'],['iPhone 15','128 ГБ · Blue','49 000',49000,'Отличное','99%','📱','Влад','5.0',22,'На гарантии'],['Realme 11 Pro','256 ГБ · Beige','13 500',13500,'Хорошее','94%','📱','София','4.8',10,'Есть чек'],['iPhone 12 mini','128 ГБ · Black','16 000',16000,'Хорошее','83%','📱','Тимур','4.6',13,'Работает отлично'],['Poco X5 Pro','256 ГБ · Yellow','12 000',12000,'Хорошее','97%','📱','Саша','4.9',16,'Быстрый смартфон'],['Samsung Z Flip 4','128 ГБ · Purple','25 000',25000,'Есть дефект','81%','📱','Глеб','4.4',4,'Следы на внутреннем экране']
];let state={money:30000,tab:'home',favorites:[],inventory:[],reviews:[],chats:{},userName:'Рамиль',filter:'Все',query:'',sort:'new',activeChat:null,profileSeller:null};let listings=initial.map((x,i)=>({id:i+1,name:x[0],spec:x[1],price:x[3],condition:x[4],battery:x[5],emoji:x[6],seller:x[7],rating:x[8],sales:x[9],desc:x[10],repairCost:x[4]==='На ремонт'?2200:x[4]==='Есть дефект'?1600:0,owned:false}));
const $=s=>document.querySelector(s), money=n=>n.toLocaleString('ru-RU')+' ₽';function save(){try{localStorage.setItem('mp-save',JSON.stringify({...state,tab:state.tab}))}catch(e){}}try{let old=JSON.parse(localStorage.getItem('mp-save'));if(old)state={...state,...old}}catch(e){}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.remove('hide');setTimeout(()=>el.classList.add('hide'),2100)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sellerBtn(name){return `<button class="sellerline" onclick="openSeller('${esc(name)}')"><span class="avatar">${name[0]}</span>${esc(name)} · ★ ${listings.find(p=>p.seller===name)?.rating||'4.8'}</button>`}
function card(p){let fav=state.favorites.includes(p.id);return `<article class="card"><div class="photo"><span class="phone-art">${p.emoji}</span><button class="heart ${fav?'on':''}" onclick="toggleFav(${p.id})">${fav?'♥':'♡'}</button></div><div class="cardbody"><div class="price">${money(p.price)}</div><div class="name">${esc(p.name)} ${esc(p.spec)}</div><div class="meta">${esc(p.condition)} · Батарея ${esc(p.battery)}</div>${p.condition!=='Отличное'?'<span class="tag">Есть нюансы</span>':''}${sellerBtn(p.seller)}<button class="btn secondary full small" style="margin-top:9px" onclick="openListing(${p.id})">Посмотреть</button></div></article>`}
function render(){ $('#balance').textContent=money(state.money);document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));let v=$('#view');if(state.tab==='home')v.innerHTML=home();if(state.tab==='search')v.innerHTML=search();if(state.tab==='fav')v.innerHTML=favs();if(state.tab==='chats')v.innerHTML=chats();if(state.tab==='profile')v.innerHTML=profile();if(state.tab==='reviews')v.innerHTML=reviewsPage();save()}
function home(){let arr=[...listings];if(state.filter!=='Все')arr=arr.filter(p=>p.condition===state.filter);return `<div class="section-head"><div><div class="section-title">Объявления рядом</div><div class="sub">${listings.length} предложений · обновлено сейчас</div></div><button class="btn small" onclick="newListing()">＋ Продать</button></div><div class="searchbar"><input placeholder="Найти телефон или модель" oninput="state.query=this.value" value="${esc(state.query)}"><button class="btn" onclick="state.tab='search';render()">Найти</button></div><div class="pillrow">${['Все','Отличное','Хорошее','Есть дефект','На ремонт'].map(f=>`<button class="pill ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div><div class="grid">${arr.filter(p=>!state.query||p.name.toLowerCase().includes(state.query.toLowerCase())).map(card).join('')}</div><div class="panel" style="margin-top:15px"><b>💡 Совет перекупа</b><div class="sub" style="margin-top:5px">Ищи телефоны с небольшими дефектами: после недорогого ремонта их можно выгодно перепродать.</div></div>`}
function search(){return `<div class="section-title">Поиск телефонов</div><div class="searchbar"><input id="q" placeholder="Например, iPhone 13" value="${esc(state.query)}"><button class="btn" onclick="doSearch()">Найти</button></div><div class="formrow"><label>Бренд</label><select id="brand"><option>Все бренды</option><option>iPhone</option><option>Samsung</option><option>Xiaomi</option><option>Google</option><option>OnePlus</option><option>Realme</option></select></div><div class="filterrow"><div class="formrow" style="flex:1"><label>Цена от, ₽</label><input id="min" type="number" placeholder="0"></div><div class="formrow" style="flex:1"><label>Цена до, ₽</label><input id="max" type="number" placeholder="100000"></div></div><div class="formrow"><label>Сортировка</label><select id="sort"><option value="new">Сначала новые</option><option value="cheap">Сначала дешевле</option><option value="expensive">Сначала дороже</option></select></div><button class="btn full" onclick="doSearch()">Показать объявления</button><div class="divider"></div><div id="results">${searchResults(listings)}</div>`}
function searchResults(arr){return `<div class="sub" style="margin-bottom:9px">Найдено: ${arr.length}</div><div class="grid">${arr.map(card).join('')}</div>`}function doSearch(){let q=$('#q').value.toLowerCase(),b=$('#brand').value,min=Number($('#min').value)||0,max=Number($('#max').value)||999999,sort=$('#sort').value;let a=listings.filter(p=>(p.name.toLowerCase().includes(q)||p.spec.toLowerCase().includes(q))&&(b==='Все бренды'||p.name.toLowerCase().includes(b.toLowerCase()))&&p.price>=min&&p.price<=max);if(sort==='cheap')a.sort((x,y)=>x.price-y.price);if(sort==='expensive')a.sort((x,y)=>y.price-x.price);$('#results').innerHTML=searchResults(a)}
function favs(){let a=listings.filter(p=>state.favorites.includes(p.id));return `<div class="section-title">Избранное</div><div class="sub" style="margin-bottom:13px">Сохранённые объявления (${a.length})</div>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty"><div class="emoji">♡</div><b>Пока ничего нет</b><p>Нажимай на сердечко в объявлениях, чтобы сохранить телефон.</p><button class="btn" onclick="state.tab='home';render()">Смотреть объявления</button></div>`}`}
function chats(){let names=Object.keys(state.chats);return `<div class="section-title">Сообщения</div><div class="sub">Переписка с продавцами и покупателями</div>${names.length?names.map(n=>`<div class="chatitem" onclick="openChat('${esc(n)}')"><span class="avatar">${n[0]}</span><div style="flex:1"><b>${esc(n)}</b><div class="sub">${esc(state.chats[n].at(-1)?.text||'Начни переписку')}</div></div><span class="muted">›</span></div>`).join(''):`<div class="empty"><div class="emoji">▤</div><b>Чатов пока нет</b><p>Открой объявление и напиши продавцу.</p></div>`}`}
function profile(){let bought=state.inventory.length,sold=state.reviews.length;return `<div class="section-title">Профиль</div><div class="panel"><div class="seller"><div class="avatar" style="width:55px;height:55px;font-size:20px">Р</div><div style="flex:1"><b style="font-size:17px">${esc(state.userName)}</b><div class="sub">Участник с ноября 2026</div><div class="stars">★★★★★ <span class="muted">5.0 · ${sold} отзывов</span></div></div><button class="btn secondary small" onclick="editName()">Изменить</button></div><div class="divider"></div><div class="stats"><div class="stat"><b>${money(state.money)}</b><span>Баланс</span></div><div class="stat"><b>${bought}</b><span>В наличии</span></div><div class="stat"><b>${sold}</b><span>Продано</span></div></div></div><div class="panel"><div class="row between"><b>Мой бизнес</b><span class="badge">Уровень 1</span></div><div class="listcard" onclick="state.tab='inventory';render()"><div class="listpic">📦</div><div><b>Мои телефоны</b><div class="sub">Покупки, ремонт и продажа</div></div></div><div class="listcard" onclick="newListing()"><div class="listpic">＋</div><div><b>Разместить объявление</b><div class="sub">Продай свой отремонтированный телефон</div></div></div><div class="listcard" onclick="state.tab='reviews';render()"><div class="listpic">⭐</div><div><b>Мои отзывы</b><div class="sub">Оценки от покупателей</div></div></div></div><div class="panel"><b>Мастерская</b><p class="sub">Ремонтируй телефоны, чтобы увеличить прибыль и рейтинг.</p><button class="btn secondary full" onclick="state.tab='inventory';render()">Открыть склад и ремонт</button></div>`}
function reviewsPage(){return `<div class="section-head"><div class="section-title">Мои отзывы</div><button class="btn light small" onclick="state.tab='profile';render()">Назад</button></div><div class="panel"><div class="stars" style="font-size:24px">★★★★★</div><b>${state.reviews.length? '5.0':'Пока нет оценок'}</b><div class="sub">Отзывы появляются после успешной продажи телефона.</div></div>${state.reviews.length?state.reviews.map(r=>`<div class="panel"><div class="row between"><b>Покупатель</b><span class="stars">★★★★★</span></div><p class="sub">${esc(r)}</p></div>`).join(''):'<div class="empty"><div class="emoji">⭐</div><b>Отзывов пока нет</b><p>Продай свой первый телефон, чтобы получить отзыв.</p></div>'}`}
function openListing(id){let p=listings.find(x=>x.id===id);if(!p)return;showModal(`<button class="close" onclick="closeModal()">×</button><div class="detailphoto">${p.emoji}</div><div class="price" style="font-size:25px">${money(p.price)}</div><h2 style="font-size:19px;margin:4px 0">${esc(p.name)}</h2><div class="sub">${esc(p.spec)} · ${esc(p.condition)}</div><div class="panel" style="margin-top:12px"><div class="row between"><span class="muted">Состояние батареи</span><b>${p.battery}</b></div><div class="divider"></div>${esc(p.desc)}</div><div class="panel" onclick="openSeller('${esc(p.seller)}')"><div class="seller"><span class="avatar">${p.seller[0]}</span><div style="flex:1"><b>${esc(p.seller)}</b><div class="stars">★ ${p.rating} <span class="muted">· ${p.sales} продаж</span></div></div><span>Профиль ›</span></div></div><button class="btn full" onclick="messageSeller('${esc(p.seller)}')">Написать продавцу</button><button class="btn secondary full" style="margin-top:8px" onclick="buyListing(${p.id})">Купить за ${money(p.price)}</button>`)}
function openSeller(name){let ps=listings.filter(p=>p.seller===name);let rating=ps[0]?.rating||'4.8';showModal(`<button class="close" onclick="closeModal()">×</button><div class="seller" style="margin:15px 0"><span class="avatar" style="width:55px;height:55px;font-size:20px">${name[0]}</span><div><h2 style="margin:0">${esc(name)}</h2><div class="stars">★ ${rating} <span class="muted">· Проверенный продавец</span></div><div class="sub">На площадке с 2025 года</div></div></div><div class="stats"><div class="stat"><b>${ps.length||2}</b><span>Объявлений</span></div><div class="stat"><b>${ps[0]?.sales||8}</b><span>Продаж</span></div><div class="stat"><b>98%</b><span>Отвечает</span></div></div><h3>Объявления продавца</h3><div class="grid">${ps.map(card).join('')||'<p>Сейчас нет активных объявлений.</p>'}</div><button class="btn full" style="margin-top:12px" onclick="messageSeller('${esc(name)}')">Написать продавцу</button>`)}
function buyListing(id){let p=listings.find(x=>x.id===id);if(state.money<p.price){toast('Не хватает денег');return}state.money-=p.price;state.inventory.push({...p,repairCost:p.repairCost||0,repaired:p.condition==='Отличное'||p.condition==='Хорошее'});closeModal();toast('Покупка совершена! Телефон добавлен на склад.');render()}
function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];render()}
function messageSeller(name){closeModal();if(!state.chats[name])state.chats[name]=[{mine:false,text:'Здравствуйте! Телефон ещё продаётся?'}];state.activeChat=name;openChat(name)}function openChat(name){state.activeChat=name;if(!state.chats[name])state.chats[name]=[];showModal(`<button class="close" onclick="closeModal();state.tab='chats';render()">×</button><h2>Чат с ${esc(name)}</h2><div class="chatlog" id="chatlog">${state.chats[name].map(m=>`<div class="chatbubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="row" style="margin-top:10px"><input id="msg" placeholder="Написать сообщение..."><button class="btn" onclick="sendMsg()">➤</button></div><div class="sub" style="margin-top:8px">Игровая переписка с виртуальным продавцом.</div>`)}function sendMsg(){let el=$('#msg'),t=el.value.trim();if(!t)return;let n=state.activeChat;state.chats[n].push({mine:true,text:t});let replies=['Могу немного уступить, какая ваша цена?','Да, телефон ещё в наличии.','Состояние соответствует описанию.','Давайте договоримся!'];state.chats[n].push({mine:false,text:replies[Math.floor(Math.random()*replies.length)]});openChat(n)}
function showModal(html){$('#modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('#modal').innerHTML=''}function newListing(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>Новое объявление</h2><p class="sub">Выстави свой телефон на продажу.</p><div class="formrow"><label>Модель</label><input id="newname" placeholder="Например, iPhone 12"></div><div class="formrow"><label>Описание</label><textarea id="newdesc" placeholder="Состояние, память, дефекты..."></textarea></div><div class="formrow"><label>Цена, ₽</label><input id="newprice" type="number" placeholder="15000"></div><button class="btn full" onclick="publish()">Опубликовать</button>`)}function publish(){let n=$('#newname').value.trim(),d=$('#newdesc').value.trim(),p=Number($('#newprice').value);if(!n||!p){toast('Укажи модель и цену');return}listings.unshift({id:Date.now(),name:n,spec:'Б/у · Смартфон',price:p,condition:'Хорошее',battery:'90%',emoji:'📱',seller:state.userName,rating:'5.0',sales:0,desc:d||'Состояние хорошее',repairCost:0});closeModal();state.tab='home';toast('Объявление опубликовано');render()}
function editName(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>Имя профиля</h2><input id="newusername" value="${esc(state.userName)}"><button class="btn full" style="margin-top:12px" onclick="state.userName=$('#newusername').value.trim()||'Игрок';closeModal();render()">Сохранить</button>`)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
// Inventory is opened from profile and includes repair/sale actions.
const oldProfile=profile;profile=function(){let base=oldProfile();return base.replace('onclick="state.tab=\'inventory\';render()"','onclick="inventory()"')};function inventory(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>Мои телефоны · Склад</h2>${state.inventory.length?state.inventory.map((p,i)=>`<div class="panel"><b>${esc(p.name)}</b><div class="sub">Покупка: ${money(p.price)} · ${p.repaired?'Готов к продаже':'Нужен ремонт'}</div>${!p.repaired?`<div class="sub">Оценка ремонта: ${money(p.repairCost||1800)}</div><button class="btn full" style="margin-top:8px" onclick="repair(${i})">🔧 Починить</button>`:`<button class="btn full" style="margin-top:8px" onclick="sell(${i})">Продать за ${money(Math.round(p.price*1.22))}</button>`}</div>`).join(''):'<div class="empty">📦<p>Склад пока пуст. Купи телефон в ленте.</p></div>'}<button class="btn secondary full" onclick="closeModal()">Закрыть</button>`)}function repair(i){let p=state.inventory[i],cost=p.repairCost||1800;if(state.money<cost){toast('Не хватает денег на детали');return}state.money-=cost;p.repaired=true;p.price=Math.round(p.price+cost);toast('Ремонт завершён!');inventory();render()}function sell(i){let p=state.inventory[i],price=Math.round(p.price*1.22);state.money+=price;state.inventory.splice(i,1);state.reviews.push('Покупатель: «Всё отлично, рекомендую!» ★★★★★');toast('Продано за '+money(price)+' · Получен отзыв 5★');inventory();render()}
render();
</script></body></html>
